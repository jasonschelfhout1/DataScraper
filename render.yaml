services:
  - type: web
    name: datascraper
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEBUG_OMGEVINGSLOKET
        value: "false"
      - key: LOCAL_DATA_DIR
        value: /tmp/datascraper
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      # Required only for the explicit, user-requested live fallback. Reauthorize when it expires.
      - key: OMGEVINGSLOKET_COOKIE_HEADER
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
  - type: cron
    name: datascraper-crawler
    runtime: node
    # Daily keeps Render's metered cron runtime comfortably below the €10 budget.
    schedule: "0 3 * * *"
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm run crawl:once
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ARCHIVE_MAX_STORAGE_BYTES
        value: "8589934592"
      - key: OMGEVINGSLOKET_COOKIE_HEADER
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
  - type: cron
    name: datascraper-db-prune
    runtime: node
    # Every Sunday at 03:30 UTC, after the daily crawler's 03:00 UTC window.
    schedule: "30 3 * * 0"
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm run db:prune
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CRAWL_TASK_RETENTION_DAYS
        value: "7"
