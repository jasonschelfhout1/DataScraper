services:
  - type: web
    name: datascraper
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 15
    envVars:
      - key: DEBUG_OMGEVINGSLOKET
        value: "false"
      - key: LOCAL_DATA_DIR
        value: /tmp/datascraper
      - key: LOG_LEVEL
        value: info
      - key: OMGEVINGSLOKET_COOKIE_HEADER
        sync: false
